services:
  postgres:
    image: postgres:18
    container_name: gerenciador-musica-db

    environment:
      POSTGRES_DB: gerenciador_musica
      POSTGRES_USER: gerenciador
      POSTGRES_PASSWORD: gerenciador
      APP_JWT_SECRET: ${APP_JWT_SECRET}
      APP_JWT_EXPIRATION_MS: ${APP_JWT_EXPIRATION_MS:-86400000}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql


    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: gerenciador-musica-backend

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/gerenciador_musica
      SPRING_DATASOURCE_USERNAME: gerenciador
      SPRING_DATASOURCE_PASSWORD: gerenciador

    ports:
      - "8080:8080"

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BUILD_CONFIGURATION: development

    container_name: gerenciador-musica-frontend

    ports:
      - "4200:80"

    depends_on:
      - backend

    restart: unless-stopped

volumes:
  postgres_data: