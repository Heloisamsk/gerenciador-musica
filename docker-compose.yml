services:
  postgres:
    image: postgres:18
    container_name: gerenciador-musica-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: gerenciador_musica
      POSTGRES_USER: gerenciador
      POSTGRES_PASSWORD: gerenciador_dev

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql
      - ./database/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gerenciador -d gerenciador_musica"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: