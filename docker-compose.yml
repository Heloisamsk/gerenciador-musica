services:
  postgres:
    image: postgres:18
    container_name: gerenciador-musica-db
    environment:
      POSTGRES_DB: gerenciador_musica
      POSTGRES_USER: gerenciador
      POSTGRES_PASSWORD: gerenciador
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  postgres-test:
    image: postgres:18
    container_name: gerenciador-musica-test-db
    environment:
      POSTGRES_DB: gerenciador_musica_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gerenciador-musica-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/gerenciador_musica
      SPRING_DATASOURCE_USERNAME: gerenciador
      SPRING_DATASOURCE_PASSWORD: gerenciador
      APP_JWT_SECRET: "${APP_JWT_SECRET:-}"
      APP_JWT_EXPIRATION_MS: "${APP_JWT_EXPIRATION_MS:-86400000}"
      APP_JWT_GENERATE_IF_MISSING: "true"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c ': > /dev/tcp/127.0.0.1/8080'"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BUILD_CONFIGURATION: development
    container_name: gerenciador-musica-frontend
    ports:
      - "4200:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  postgres_test_data:
