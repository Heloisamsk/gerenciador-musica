# Perfil de producao, ativado no Render via SPRING_PROFILES_ACTIVE=prod.
# SPRING_DATASOURCE_URL/USERNAME/PASSWORD continuam vindo de variaveis de
# ambiente (ver application.properties) - configure-as no painel do Render
# com os dados do banco PostgreSQL dedicado. O Postgres do Render exige TLS,
# entao a URL deve incluir "?sslmode=require".

# O Render informa a porta esperada atraves da variavel PORT.
server.port=${PORT:8080}

app.cors.allowed-origins=https://gerenciador-musica.onrender.com

spring.jpa.show-sql=false
