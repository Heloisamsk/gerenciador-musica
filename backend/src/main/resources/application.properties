spring.application.name=gerenciador-musica-backend

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/gerenciador_musica}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:gerenciador}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:gerenciador}

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false