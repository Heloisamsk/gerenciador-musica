# Perfil usado pelos testes locais e pelo GitHub Actions.
# Localmente, o servico postgres-test do docker-compose.yml expoe a porta 5433.
spring.datasource.url=${TEST_DATASOURCE_URL:jdbc:postgresql://localhost:5433/gerenciador_musica_test}
spring.datasource.username=${TEST_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${TEST_DATASOURCE_PASSWORD:postgres}

# Gera uma chave descartavel para os testes quando APP_JWT_SECRET nao for informada.
app.jwt.secret=${APP_JWT_SECRET:${random.value}}
