name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  build-test-analyze:
    runs-on: ubuntu-latest


    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gerenciador_musica_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # O histórico completo permite que o SonarCloud
          # compare as alterações do Pull Request com a main.
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Gera uma chave JWT temporária e segura para esta execução.
      # A chave não é salva no repositório e deixa de existir
      # quando o workflow termina.
      - name: Generate temporary JWT secret for tests
        shell: bash
        run: |
          JWT_TEST_SECRET="$(openssl rand -base64 48 | tr -d '\n')"
          echo "::add-mask::$JWT_TEST_SECRET"
          echo "APP_JWT_SECRET=$JWT_TEST_SECRET" >> "$GITHUB_ENV"

      - name: Build and run tests with coverage
        env:
          SPRING_PROFILES_ACTIVE: test
        run: |
          chmod +x mvnw
          ./mvnw -B clean test
