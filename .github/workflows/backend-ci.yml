name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  build-test-analyze:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gerenciador_musica_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # historico completo: o SonarCloud usa isso pra comparar com o main
          # e mostrar o que mudou no Pull Request.
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and run tests with coverage
        env:
          SPRING_PROFILES_ACTIVE: test
        run: |
          chmod +x mvnw
          ./mvnw -B clean test

      # Roda a analise de qualidade no SonarCloud (issues de seguranca,
      # manutenibilidade, duplicacao) usando o relatorio de cobertura do
      # JaCoCo gerado no passo anterior. So executa se o secret SONAR_TOKEN
      # ja tiver sido configurado nas settings do repositorio no GitHub -
      # ate la, o workflow continua verde com build + testes.
      - name: SonarCloud analysis
        if: env.SONAR_TOKEN != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          ./mvnw -B sonar:sonar
          -Dsonar.projectKey=projeto-gerenciador-musica_gerenciador-musica
          -Dsonar.organization=projeto-gerenciador-musica
          -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
