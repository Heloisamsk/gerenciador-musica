<a class="review-card" [routerLink]="['/reviews', review().idReview]">
  <span class="review-card__capa">
    <img
      [src]="review().alvo.capaUrl || '/capa-padrao.png'"
      [alt]="'Capa de ' + review().alvo.titulo"
      loading="lazy"
      (error)="aoFalharCapa($event)"
    />
    @if (review().minhaReview) {
      <span class="review-card__selo">Sua review</span>
    }
  </span>

  <strong class="review-card__titulo">{{ review().alvo.titulo }}</strong>
  <span class="review-card__meta">
    @if (review().alvo.artista) {
      {{ review().alvo.artista }}
    }
  </span>

  <span class="review-card__rodape">
    <app-star-rating [nota]="review().nota" />
    @if (review().minhaReview) {
      <span class="review-card__autor">Você</span>
    } @else {
      <button type="button" class="review-card__autor review-card__autor--link" (click)="irParaPerfilAutor($event)">
        {{ review().autor.nome }}
      </button>
    }
  </span>
</a>
