@if (interativo()) {
  <fieldset class="star-rating star-rating--interativo">
    <legend class="star-rating__rotulo-oculto">{{ rotulo() }}</legend>

    @for (valor of estrelas; track valor) {
      <label
        class="star-rating__botao"
        (mouseenter)="aoPassarMouse(valor)"
        (mouseleave)="aoSairMouse()"
      >
        <input
          type="radio"
          [name]="grupoNome"
          [value]="valor"
          [checked]="nota() === valor"
          (change)="aoClicar(valor)"
          (focus)="aoPassarMouse(valor)"
          (blur)="aoSairMouse()"
        />
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            [class.estrela-preenchida]="notaExibida() >= valor"
            [class.estrela-vazia]="notaExibida() < valor"
            d="M12 2.5 14.9 9l7.1.6-5.4 4.7 1.7 6.9L12 17.4 5.7 21.2l1.7-6.9L2 9.6 9.1 9z"
          />
        </svg>
        <span class="star-rating__rotulo-oculto">
          {{ valor }} {{ valor > 1 ? 'estrelas' : 'estrela' }}
        </span>
      </label>
    }
  </fieldset>
} @else {
  <svg
    class="star-rating"
    viewBox="0 0 130 24"
    role="img"
    [attr.aria-label]="rotulo() + ': ' + nota() + ' de 5'"
  >
    @for (valor of estrelas; track valor; let indice = $index) {
      <path
        [attr.transform]="'translate(' + indice * 26 + ', 0)'"
        [class.estrela-preenchida]="notaExibida() >= valor"
        [class.estrela-vazia]="notaExibida() < valor"
        d="M12 2.5 14.9 9l7.1.6-5.4 4.7 1.7 6.9L12 17.4 5.7 21.2l1.7-6.9L2 9.6 9.1 9z"
      />
    }
  </svg>
}
