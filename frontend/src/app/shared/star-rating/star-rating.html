@if (interativo()) {
  <fieldset class="star-rating star-rating--interativo" (mouseleave)="aoSairMouse()">
    <legend class="star-rating__rotulo-oculto">{{ rotulo() }}</legend>

    @for (valor of estrelas; track valor; let indice = $index) {
      <span class="star-rating__estrela">
        <button
          type="button"
          class="star-rating__metade star-rating__metade--esquerda"
          [attr.aria-label]="(valor - 0.5) + ' de 5'"
          (mouseenter)="aoPassarMouse(valor, 'esquerda')"
          (focus)="aoPassarMouse(valor, 'esquerda')"
          (click)="aoClicar(valor, 'esquerda')"
        ></button>
        <button
          type="button"
          class="star-rating__metade star-rating__metade--direita"
          [attr.aria-label]="valor + ' de 5'"
          (mouseenter)="aoPassarMouse(valor, 'direita')"
          (focus)="aoPassarMouse(valor, 'direita')"
          (click)="aoClicar(valor, 'direita')"
        ></button>

        <svg viewBox="0 0 24 24" aria-hidden="true">
          <defs>
            <clipPath [attr.id]="grupoNome + '-clip-' + indice">
              <rect x="0" y="0" [attr.width]="24 * fracaoPreenchida(valor)" height="24" />
            </clipPath>
          </defs>
          <path
            class="estrela-vazia"
            d="M12 2.5 14.9 9l7.1.6-5.4 4.7 1.7 6.9L12 17.4 5.7 21.2l1.7-6.9L2 9.6 9.1 9z"
          />
          <path
            class="estrela-preenchida"
            [attr.clip-path]="'url(#' + grupoNome + '-clip-' + indice + ')'"
            d="M12 2.5 14.9 9l7.1.6-5.4 4.7 1.7 6.9L12 17.4 5.7 21.2l1.7-6.9L2 9.6 9.1 9z"
          />
        </svg>
      </span>
    }
  </fieldset>
} @else {
  <svg
    class="star-rating"
    viewBox="0 0 130 24"
    role="img"
    [attr.aria-label]="rotulo() + ': ' + nota() + ' de 5'"
  >
    @for (valor of estrelas; track valor; let indice = $index) {
      <g [attr.transform]="'translate(' + indice * 26 + ', 0)'">
        <defs>
          <clipPath [attr.id]="grupoNome + '-clip-' + indice">
            <rect x="0" y="0" [attr.width]="24 * fracaoPreenchida(valor)" height="24" />
          </clipPath>
        </defs>
        <path
          class="estrela-vazia"
          d="M12 2.5 14.9 9l7.1.6-5.4 4.7 1.7 6.9L12 17.4 5.7 21.2l1.7-6.9L2 9.6 9.1 9z"
        />
        <path
          class="estrela-preenchida"
          [attr.clip-path]="'url(#' + grupoNome + '-clip-' + indice + ')'"
          d="M12 2.5 14.9 9l7.1.6-5.4 4.7 1.7 6.9L12 17.4 5.7 21.2l1.7-6.9L2 9.6 9.1 9z"
        />
      </g>
    }
  </svg>
}
