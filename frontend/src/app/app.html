<router-outlet></router-outlet>

<button class="tema-toggle" type="button"
  [attr.aria-label]="temaService.rotuloAcao()"
  [attr.title]="temaService.rotuloAcao()"
  (click)="temaService.alternar()">
  @if (temaService.tema() === 'escuro') {
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="4"></circle>
      <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
    </svg>
    <span>Modo claro</span>
  } @else {
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5 8.5 8.5 0 1 0 20.5 14.2Z"></path>
    </svg>
    <span>Modo escuro</span>
  }
</button>
