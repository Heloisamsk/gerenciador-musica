@if (participantes().length > 0) {
  <ul class="participantes-lista">
    @for (artista of participantes(); track artista.id) {
      <li class="participante-item">{{ artista.nome }}</li>
    }
  </ul>
} @else {
  <span aria-hidden="true">-</span>
  <span class="texto-acessivel">Nenhum artista participante</span>
}
