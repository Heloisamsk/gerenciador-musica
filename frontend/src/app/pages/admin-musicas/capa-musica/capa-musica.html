@if (capaDisponivel()) {
  <img
    class="capa-album"
    [src]="musica().album?.capaUrl"
    [alt]="'Capa do álbum ' + musica().album?.titulo"
    loading="lazy"
    (error)="registrarErro()"
  >
} @else {
  <span class="capa-album capa-alternativa">
    <span aria-hidden="true">♪</span>
    <span class="texto-acessivel">
      @if (musica().album) {
        Capa indisponível para o álbum {{ musica().album?.titulo }}
      } @else {
        Música sem álbum
      }
    </span>
  </span>
}
