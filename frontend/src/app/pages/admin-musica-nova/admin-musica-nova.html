<div class="cadastro-container">
  <div class="cadastro-card">
    <img src="https://upload.wikimedia.org/wikipedia/commons/1/19/Spotify_logo_without_text.svg" alt="Logo do Spotify" class="login-logo" />
    <h2 class="cadastro-title">Cadastrar Música</h2>
    <div class="alerta alerta-sucesso" *ngIf="mensagemSucesso()">
      {{ mensagemSucesso() }}
    </div>
    <div class="alerta alerta-erro" *ngIf="mensagemErro()">
      {{ mensagemErro() }}
    </div>
    <form class="cadastro-form" [formGroup]="formularioMusica" (ngSubmit)="salvar()">

      <div class="form-group">
        <label for="titulo">Título da Música</label>
        <input id="titulo" type="text" class="form-input" formControlName="titulo" placeholder="Ex: Bohemian Rhapsody">
        <small class="error-message" *ngIf="formularioMusica.get('titulo')?.invalid && formularioMusica.get('titulo')?.touched">
          O título é obrigatório.
        </small>
      </div>
      <div class="form-group">
        <label for="duracao">Duração (em segundos)</label>
        <input id="duracao" type="text" class="form-input" formControlName="duracao" placeholder="Ex: 355">
        <small class="error-message" *ngIf="formularioMusica.get('duracao')?.invalid && formularioMusica.get('duracao')?.touched">
          A duração é obrigatória.
        </small>
      </div>
      <div class="form-group">
        <label for="anoLancamento">Ano de Lançamento</label>
        <input id="anoLancamento" type="number" class="form-input" formControlName="anoLancamento" placeholder="Ex: 1975">
        <small class="error-message" *ngIf="formularioMusica.get('anoLancamento')?.invalid && formularioMusica.get('anoLancamento')?.touched">
          O ano é obrigatório.
        </small>
      </div>
      <div class="form-group">
        <label for="genero">Gênero</label>
        <input id="genero" type="text" class="form-input" formControlName="genero" placeholder="Ex: Rock">
        <small class="error-message" *ngIf="formularioMusica.get('genero')?.invalid && formularioMusica.get('genero')?.touched">
          O gênero é obrigatório.
        </small>
      </div>
      <div class="form-group">
        <label for="artistaPrincipalId">Artista</label>

        <select
          id="artistaPrincipalId"
          class="form-input"
          formControlName="artistaPrincipalId"
          [disabled]="carregandoArtistas()"
        >
          <option [ngValue]="null" disabled>
            @if (carregandoArtistas()) {
            Carregando artistas...
            } @else {
            Selecione um artista
            }
          </option>

          @for (artista of artistas(); track artista.idArtista) {
          <option [ngValue]="artista.idArtista">
            {{ artista.nome }}
          </option>
          }
        </select>

        <small
          class="error-message"
          *ngIf="
      formularioMusica.get('artistaPrincipalId')?.invalid &&
      formularioMusica.get('artistaPrincipalId')?.touched
    "
        >
          O artista é obrigatório.
        </small>

        @if (erroArtistas()) {
        <small class="error-message">
          {{ erroArtistas() }}
        </small>
        }
      </div>
      <div class="form-group">
        <label for="album">Álbum</label>
        <input id="album" type="text" class="form-input" formControlName="album" placeholder="Ex: A Night at the Opera">
        <small class="error-message" *ngIf="formularioMusica.get('album')?.invalid && formularioMusica.get('album')?.touched">
          O álbum é obrigatório.
        </small>
      </div>
      <button type="submit" class="cadastro-btn" [disabled]="formularioMusica.invalid || carregando()">
        <span *ngIf="!carregando()">Salvar Música</span>
        <span *ngIf="carregando()">Salvando...</span>
      </button>
    </form>
  </div>
</div>
