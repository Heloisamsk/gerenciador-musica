sonar.projectKey=projeto-gerenciador-musica_gerenciador-musica
sonar.organization=projeto-gerenciador-musica
sonar.host.url=https://sonarcloud.io
sonar.sourceEncoding=UTF-8

# Código-fonte analisado
sonar.sources=backend/src/main,frontend/src,scripts/povoamento,.github/workflows,backend/Dockerfile,frontend/Dockerfile,docker-compose.yml

# Testes
sonar.tests=backend/src/test,frontend/src
sonar.test.inclusions=backend/src/test/**/*.java,frontend/src/**/*.spec.ts

# Arquivos que não devem ser tratados como código-fonte
sonar.exclusions=frontend/src/**/*.spec.ts,frontend/node_modules/**,frontend/dist/**,backend/target/**,scripts/povoamento/dados_coletados.json

# Cobertura do frontend
sonar.javascript.lcov.reportPaths=frontend/coverage/**/lcov.info

# Cobertura do backend
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml

# Scripts de povoamento não participam da cobertura da aplicação
sonar.coverage.exclusions=scripts/povoamento/**

# Análise Java
sonar.java.source=21
sonar.java.binaries=backend/target/classes
sonar.java.libraries=backend/target/dependency/*.jar
sonar.java.test.binaries=backend/target/test-classes
sonar.java.test.libraries=backend/target/dependency/*.jar

# Análise Python
sonar.python.version=3.12

# O banco do projeto é PostgreSQL.
# O SonarCloud classifica arquivos .sql como Oracle PL/SQL por padrão.
# Somente arquivos terminados em .plsql serão enviados ao analisador PL/SQL.
sonar.plsql.file.suffixes=plsql